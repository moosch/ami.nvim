name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/amid ./cmd/amid
